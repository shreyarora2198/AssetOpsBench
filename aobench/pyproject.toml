[project]
name = "AssetOpsBench"
version = "0.1.0"
description = "Asset operations benchmarking"
readme = "README.md"
# pyarrow (via mlflow) has no binary wheels on CPython 3.14 yet — sdists fail without Arrow C++.
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "huggingface-hub>=0.35.3",
    "scenario-client",
    "scenario-server",
]


[tool.uv.workspace]
members = [
    "scenario-client",
    "scenario-server",
]

[tool.uv.sources]
scenario-client = { workspace = true }
scenario-server = { workspace = true }
